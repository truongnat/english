  const lessonData = {

    day: 3,

      { en: "love (to love)", ipa: "/lʌv/", vi: "rất thích / yêu thích", example: "She **loves** playing football." },
      { en: "enjoy (to enjoy)", ipa: "/ɪnˈdʒɔɪ/", vi: "thích thú / tận hưởng", example: "He **enjoys** watching movies." },
      { en: "read (reading)", ipa: "/riːd/", vi: "đọc (việc đọc)", example: "I like **reading** books." },
      { en: "watch (watching)", ipa: "/wɑːtʃ/", vi: "xem (việc xem)", example: "He enjoys **watching** movies." },
      { en: "play (playing)", ipa: "/pleɪ/", vi: "chơi (việc chơi)", example: "She loves **playing** football." },
      { en: "listen to (listening to)", ipa: "/ˈlɪsən tə/", vi: "nghe (việc nghe)", example: "I like **listening to** music." },
      { en: "cook (cooking)", ipa: "/kʊk/", vi: "nấu ăn (việc nấu)", example: "My mother loves **cooking**." },
      { en: "travel (traveling)", ipa: "/ˈtrævəl/", vi: "du lịch (việc đi du lịch)", example: "They enjoy **traveling**." },
      { en: "music", ipa: "/ˈmjuːzɪk/", vi: "âm nhạc", example: "I like listening to **music**." },
      { en: "movie", ipa: "/ˈmuːvi/", vi: "phim", example: "He watches a **movie** every weekend." },
      { en: "football", ipa: "/ˈfʊtbɔːl/", vi: "bóng đá", example: "We play **football** every weekend." }
    ],

    grammar: {
      point: "Sở thích: like / love / enjoy + V-ing",
      explanation: "Để nói về sở thích, dùng `like/love/enjoy` (chia theo chủ ngữ như động từ thường) + động từ thêm `-ing` (gọi là **V-ing**, không chia thì). Ví dụ: `I like reading`, `She loves playing football`, `He enjoys watching movies`. Lưu ý: bản thân `like/love/enjoy` vẫn phải thêm `s` nếu chủ ngữ là **he/she/it**.",
      examples: ["I **like reading** books.", "She **loves playing** football.", "He **enjoys watching** movies."],
      commonMistake: {
        wrong: "She loves play football.",
        right: "She loves playing football.",
        note: "Người học hay quên thêm `-ing` vào động từ thứ hai vì trong tiếng Việt 'thích chơi' chỉ ghép trực tiếp 2 động từ, không cần biến đổi. Trong tiếng Anh, động từ đứng SAU `like/love/enjoy` luôn phải ở dạng `V-ing`."
      },
      memoryTip: "Công thức 'kép': **chủ ngữ + like/love/enjoy (chia ngôi) + V-ing** — nhớ động từ thứ 2 luôn mặc 'áo -ing'."
    },

    dialogue: {
      titleVi: "Tình huống: hỏi thăm sở thích cuối tuần",
      lines: [
        { speaker: "A", en: "What do you like doing in your free time?", vi: "Bạn thích làm gì lúc rảnh?" },
        { speaker: "B", en: "I love reading books. What about you?", vi: "Tôi rất thích đọc sách. Còn bạn?" },
        { speaker: "A", en: "I enjoy playing football with my friends.", vi: "Tôi thích chơi bóng đá với bạn bè." },
        { speaker: "B", en: "That sounds fun! My sister loves cooking too.", vi: "Nghe vui đấy! Em gái tôi cũng rất thích nấu ăn." }
      ]
    },

    exercises: {
      multipleChoice: [
        { q: "I like ___ books.", options: ["read", "reads", "reading"], answer: "reading", difficulty: "easy" },
        { q: "She loves ___ football.", options: ["play", "plays", "playing"], answer: "playing", difficulty: "medium" },
        { q: "He ___ watching movies, and they ___ traveling.", options: ["enjoys / enjoy", "enjoy / enjoys", "enjoys / enjoys"], answer: "enjoys / enjoy", difficulty: "hard" },
        { q: "Từ nào nghĩa là \"giáo viên\"? (ôn lại Ngày 2)", options: ["tester", "teacher", "manager"], answer: "teacher", difficulty: "easy" }
      ],
      trueFalse: [
        { statement: "Động từ đứng sau `like/love/enjoy` phải thêm `-ing`.", isTrue: true, difficulty: "easy" },
        { statement: "Câu `She loves play football` viết đúng ngữ pháp.", isTrue: false, difficulty: "medium" },
        { statement: "`Enjoy` có nghĩa là 'ghét'.", isTrue: false, difficulty: "easy" }
      ],
      fillBlank: [
        { sentence: "I like ___ music. (listen to)", answer: "listening to", hint: "V-ing", difficulty: "medium" },
        { sentence: "He ___ watching movies. (enjoy, ngôi 3)", answer: "enjoys", hint: "chia động từ theo chủ ngữ", difficulty: "medium" }
      ],
      sentenceBuild: [
        { words: ["reading", "love", "I", "books"], answer: "I love reading books", difficulty: "medium" },
        { words: ["playing", "enjoys", "football", "He"], answer: "He enjoys playing football", difficulty: "hard" }
      ],
      matching: [
        {
          difficulty: "easy",
          pairs: [
            { en: "reading", vi: "đọc sách" },
            { en: "cooking", vi: "nấu ăn" },
            { en: "traveling", vi: "du lịch" },
            { en: "music", vi: "âm nhạc" },
            { en: "football", vi: "bóng đá" }
          ]
        }
      ]
    }
  };
  // ============ HẾT VÙNG SỬA ============

  const KEY_STREAK = "eng:streak";
  const KEY_DAYS = "eng:completed-days";
  const KEY_SCORES = "eng:scores";
  const dayId = `w${lessonData.week}d${lessonData.day}`;

  // ---------- Store: 1 construct lưu trữ DUY NHẤT dùng chung mọi trang ----------
  // Trong Claude.ai: dùng window.storage (cơ chế artifact hỗ trợ chính thức).
  // Ngoài Claude.ai (mở file trực tiếp / tự host): tự chuyển sang localStorage thật
  // của trình duyệt, vẫn cùng 1 bộ key nên dữ liệu vẫn liền mạch giữa các trang.
  const Store = {
    hasClaude: typeof window.storage !== "undefined",
    async get(key) {
      if (this.hasClaude) {
        try { const r = await window.storage.get(key, false); return r ? r.value : null; }
        catch (e) { return null; }
      }
      try { return localStorage.getItem(key); } catch (e) { return null; }
    },
    async set(key, value) {
      if (this.hasClaude) {
        try { await window.storage.set(key, value, false); return true; }
        catch (e) { return false; }
      }
      try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
    }
  };

  // ---------- Markdown (an toàn khi marked.js không tải được) ----------
  function md(text) {
    if (!text) return "";
    try {
      if (typeof marked !== "undefined") return marked.parseInline(String(text));
    } catch (e) {}
    return String(text);
  }

  // ---------- Text-to-speech: làm sạch trước khi đọc ----------
  const ttsOk = typeof window.speechSynthesis !== "undefined";
  function cleanForSpeech(text) {
    let t = String(text).replace(/\([^)]*\)/g, "");      // bỏ phần trong ngoặc
    const parts = t.split("/").map(p => p.trim()).filter(Boolean); // "hello / hi" -> ["hello","hi"]
    return parts.join(", ");
  }
  function speak(text) {
    if (!ttsOk) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
      u.lang = "en-US";
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    } catch (e) { /* một số sandbox chặn speech, bỏ qua */ }
  }

  // ---------- Icon SVG dùng chung ----------
  const ICONS = {
    card: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="10" rx="2"/><rect x="7.5" y="9" width="14" height="10" rx="2" fill="var(--card)"/></svg>`,
    book: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c2-1 5-1 7 0v14c-2-1-5-1-7 0V5Z"/><path d="M21 5c-2-1-5-1-7 0v14c2-1 5-1 7 0V5Z"/></svg>`,
    chat: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-4 4V5Z"/></svg>`,
    pencil: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1Z"/></svg>`,
    bulb: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11c.6.4 1 1 1 1.7V17h4v-1.3c0-.7.4-1.3 1-1.7a6 6 0 0 0-3-11Z"/></svg>`,
    flame: `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2c1 3-3 4-3 8a3 3 0 0 0 6 0c0-1-.5-2-1-2.5.7 1 1 2 1 3.5a4 4 0 1 1-8 0c0-4 3-5 5-9Z"/></svg>`,
    speaker: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor" stroke="none"/><path d="M16 8c1.5 1.2 1.5 6.8 0 8M19 5c3 3 3 11 0 14"/></svg>`,
    wrong: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>`,
    right: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>`
  };

  function mascotSvg() {
    return `<svg class="eng-mascot" viewBox="0 0 120 100" width="84" height="70">
      <path d="M10 70 C8 32 38 8 66 14 C97 20 112 52 95 79 C79 104 30 101 10 70Z" fill="var(--accent-soft)" opacity="0.55"/>
      <g transform="translate(26,26)">
        <path d="M0 6c8-4 18-4 26 0v34c-8-4-18-4-26 0V6Z" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
        <path d="M52 6c-8-4-18-4-26 0v34c8-4 18-4 26 0V6Z" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>
      </g>
      <g stroke="var(--accent)" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M90 22c4 2 6 6 6 10"/>
        <path d="M97 16c6 3 9 9 9 16"/>
      </g>
      <circle cx="18" cy="20" r="2.4" fill="var(--accent)"/>
      <circle cx="102" cy="62" r="2" fill="var(--accent)"/>
    </svg>`;
  }

  function progressRing(day, total) {
    const r = 24, c = 2 * Math.PI * r;
    const pct = Math.max(0, Math.min(day / total, 1));
    const offset = c * (1 - pct);
    return `<svg class="eng-ring" viewBox="0 0 60 60" width="60" height="60">
      <circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--accent-soft)" stroke-width="6"/>
      <circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 30 30)"/>
      <text x="30" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${day}/${total}</text>
      <text x="30" y="39" text-anchor="middle" font-size="7" fill="var(--ink-soft)">ngày</text>
    </svg>`;
  }

  function diffBadge(level) {
    const map = {
      easy: ["Dễ", "var(--good)", "var(--good-bg)"],
      medium: ["Trung bình", "var(--tip)", "var(--tip-bg)"],
      hard: ["Khó", "var(--bad)", "var(--bad-bg)"]
    };
    const [label, color, bg] = map[level] || map.medium;
    return `<span class="eng-diff" style="color:${color};background:${bg}">${label}</span>`;
  }

  const app = document.getElementById("eng-app");

  function speakBtn(text) {
    if (!ttsOk) return "";
    return `<button class="eng-speak" data-speak="${cleanForSpeech(text).replace(/"/g, "&quot;")}" title="Nghe đọc">${ICONS.speaker}</button>`;
  }

  function flashHtml(v) {
    return `<div class="eng-flash">
      ${speakBtn(v.en)}
      <div class="front">${v.en}</div>
      ${v.ipa ? `<div class="ipa">${v.ipa}</div>` : ""}
      <div class="back">${v.vi}</div>
      <div class="eng-example">${md(v.example)}</div>
    </div>`;
  }

  function dialogueHtml(d) {
    return d.lines.map((line) => `
      <div class="eng-dialogue-line ${line.speaker.toLowerCase() === "b" ? "b" : ""}">
        <div class="eng-dialogue-avatar">${line.speaker}</div>
        <div class="eng-dialogue-bubble">
          <div class="eng-dialogue-en">${line.en} ${speakBtn(line.en)}</div>
          <div class="eng-dialogue-vi">${md(line.vi)}</div>
        </div>
      </div>`).join("") + `<button class="eng-toggle-vi" id="eng-toggle-vi">Hiện nghĩa tiếng Việt</button>`;
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function normalize(s) {
    return s.toLowerCase().replace(/[.?!,]/g, "").trim().replace(/\s+/g, " ");
  }

  function render(streak, completedCount) {
    const ex = lessonData.exercises;

    app.innerHTML = `
      <div class="eng-header">
        <div class="eng-header-left">
          ${mascotSvg()}
          <div>
            <p class="eng-title">Tuần ${lessonData.week} · Ngày ${lessonData.day}: ${lessonData.title}</p>
            <p class="eng-sub">${lessonData.titleEn}</p>
          </div>
        </div>
        <div class="eng-header-right">
          ${progressRing(lessonData.day, 7)}
          <div class="eng-streak" id="eng-streak-badge">${ICONS.flame}<b id="eng-streak-num">${streak}</b><span style="color:var(--ink-soft); font-weight:400;">· <span id="eng-days-num">${completedCount}</span> buổi</span></div>
        </div>
      </div>

      <div class="eng-card">
        <p class="eng-section-title"><span class="eng-icon">${ICONS.card}</span>Từ vựng (bấm để lật, bấm 🔊 để nghe)</p>
        <div class="eng-flash-grid">${lessonData.vocab.map(flashHtml).join("")}</div>
      </div>

      <div class="eng-card">
        <p class="eng-section-title"><span class="eng-icon">${ICONS.book}</span>Ngữ pháp: ${lessonData.grammar.point}</p>
        <p>${md(lessonData.grammar.explanation)}</p>
        <div class="eng-grammar-ex-list">
          ${lessonData.grammar.examples.map(e => `<div class="eng-grammar-ex-row">${speakBtn(e.replace(/\*\*/g, ""))}${md(e)}</div>`).join("")}
        </div>
        ${lessonData.grammar.commonMistake ? `
        <div class="eng-mistake">
          <div class="eng-mistake-box wrong">${ICONS.wrong}<span><b>Sai thường gặp</b><span class="txt">${lessonData.grammar.commonMistake.wrong}</span></span></div>
          <div class="eng-mistake-box right">${ICONS.right}<span><b>Đúng</b><span class="txt">${lessonData.grammar.commonMistake.right}</span></span></div>
        </div>
        <p class="eng-section-sub" style="margin-top:8px;">${md(lessonData.grammar.commonMistake.note)}</p>` : ""}
        ${lessonData.grammar.memoryTip ? `<div class="eng-tip-box"><span class="eng-icon">${ICONS.bulb}</span>${md(lessonData.grammar.memoryTip)}</div>` : ""}
      </div>

      ${lessonData.dialogue ? `
      <div class="eng-card">
        <p class="eng-section-title"><span class="eng-icon">${ICONS.chat}</span>Hội thoại mẫu</p>
        <p class="eng-section-sub">${lessonData.dialogue.titleVi}</p>
        ${dialogueHtml(lessonData.dialogue)}
      </div>` : ""}

      <div class="eng-card">
        <p class="eng-section-title"><span class="eng-icon">${ICONS.pencil}</span>Luyện tập</p>

        ${ex.multipleChoice && ex.multipleChoice.length ? `<div class="eng-ex-block"><p class="eng-section-sub" style="margin-top:0;">Phần 1 · Trắc nghiệm</p><div id="eng-mc"></div></div>` : ""}
        ${ex.trueFalse && ex.trueFalse.length ? `<div class="eng-ex-block"><p class="eng-section-sub">Phần 2 · Đúng hay Sai</p><div id="eng-tf"></div></div>` : ""}
        ${ex.fillBlank && ex.fillBlank.length ? `<div class="eng-ex-block"><p class="eng-section-sub">Phần 3 · Điền từ</p><div id="eng-fill"></div></div>` : ""}
        ${ex.sentenceBuild && ex.sentenceBuild.length ? `<div class="eng-ex-block"><p class="eng-section-sub">Phần 4 · Sắp xếp câu</p><div id="eng-build"></div></div>` : ""}
        ${ex.matching && ex.matching.length ? `<div class="eng-ex-block"><p class="eng-section-sub">Phần 5 · Ghép cặp từ – nghĩa</p><div id="eng-match"></div></div>` : ""}

        <button class="eng-btn" id="eng-submit">Kiểm tra kết quả</button>
        <div class="eng-result" id="eng-result"></div>
      </div>

      <p class="eng-tip">Học xong, quay lại chat và nói với Claude: "Hôm nay học tiếp ngày ${lessonData.day + 1}" để tiếp tục lộ trình.</p>
    `;

    app.querySelectorAll("[data-speak]").forEach(btn => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); speak(btn.dataset.speak); });
    });
    app.querySelectorAll(".eng-flash").forEach(el => {
      el.addEventListener("click", (e) => { if (!e.target.closest(".eng-speak")) el.classList.toggle("flipped"); });
    });
    const toggleBtn = document.getElementById("eng-toggle-vi");
    if (toggleBtn) {
      let shown = false;
      toggleBtn.addEventListener("click", () => {
        shown = !shown;
        app.querySelectorAll(".eng-dialogue-vi").forEach(el => el.classList.toggle("show", shown));
        toggleBtn.textContent = shown ? "Ẩn nghĩa tiếng Việt" : "Hiện nghĩa tiếng Việt";
      });
    }

    // ---- Multiple choice ----
    const mcSelections = {};
    const mcBox = document.getElementById("eng-mc");
    if (mcBox) {
      ex.multipleChoice.forEach((q, qi) => {
        const block = document.createElement("div");
        block.className = "eng-quiz-q";
        block.innerHTML = `<p>${qi + 1}. ${md(q.q)}${diffBadge(q.difficulty)}</p>` +
          q.options.map(opt => `<button class="eng-opt" data-qi="${qi}" data-opt="${opt}">${opt}</button>`).join("");
        mcBox.appendChild(block);
      });
      mcBox.querySelectorAll(".eng-opt").forEach(btn => {
        btn.addEventListener("click", () => {
          const qi = btn.dataset.qi;
          mcBox.querySelectorAll(`.eng-opt[data-qi="${qi}"]`).forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          mcSelections[qi] = btn.dataset.opt;
        });
      });
    }

    // ---- True / False ----
    const tfSelections = {};
    const tfBox = document.getElementById("eng-tf");
    if (tfBox) {
      ex.trueFalse.forEach((q, qi) => {
        const block = document.createElement("div");
        block.className = "eng-quiz-q";
        block.innerHTML = `<p>${qi + 1}. ${md(q.statement)}${diffBadge(q.difficulty)}</p>
          <div class="eng-opt-row">
            <button class="eng-opt" data-tf="${qi}" data-val="true">Đúng (True)</button>
            <button class="eng-opt" data-tf="${qi}" data-val="false">Sai (False)</button>
          </div>`;
        tfBox.appendChild(block);
      });
      tfBox.querySelectorAll(".eng-opt").forEach(btn => {
        btn.addEventListener("click", () => {
          const qi = btn.dataset.tf;
          tfBox.querySelectorAll(`.eng-opt[data-tf="${qi}"]`).forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          tfSelections[qi] = btn.dataset.val;
        });
      });
    }

    // ---- Fill blank ----
    const fillBox = document.getElementById("eng-fill");
    if (fillBox) {
      ex.fillBlank.forEach((q, qi) => {
        const [before, after] = q.sentence.split("___");
        const block = document.createElement("div");
        block.className = "eng-quiz-q";
        block.innerHTML = `<p>${qi + 1}. ${before}<input class="eng-fill-input" data-qi="${qi}" type="text"/>${after || ""}${diffBadge(q.difficulty)}</p>
          <div class="eng-fill-hint">Gợi ý: ${q.hint}</div>`;
        fillBox.appendChild(block);
      });
    }

    // ---- Sentence build ----
    const buildBox = document.getElementById("eng-build");
    const buildState = {};
    if (buildBox) {
      ex.sentenceBuild.forEach((q, qi) => {
        const wrap = document.createElement("div");
        wrap.className = "eng-quiz-q";
        wrap.innerHTML = `<p>${qi + 1}. Sắp xếp thành câu đúng:${diffBadge(q.difficulty)}</p>
          <div class="eng-build-answer" id="eng-build-ans-${qi}"></div>
          <div class="eng-build-pool" id="eng-build-pool-${qi}"></div>
          <button class="eng-btn ghost" data-reset="${qi}" style="margin-top:6px;">Làm lại</button>
          <div class="eng-build-result" id="eng-build-result-${qi}"></div>`;
        buildBox.appendChild(wrap);
        buildState[qi] = { order: shuffle(q.words.map((w, wi) => ({ w, wi }))), used: new Set() };
        renderBuildPool(qi);
      });

      function renderBuildPool(qi) {
        const pool = document.getElementById(`eng-build-pool-${qi}`);
        const st = buildState[qi];
        pool.innerHTML = st.order.map(item =>
          `<span class="eng-build-word${st.used.has(item.wi) ? " used" : ""}" data-qi="${qi}" data-wi="${item.wi}">${item.w}</span>`
        ).join("");
        pool.querySelectorAll(".eng-build-word").forEach(el => {
          el.addEventListener("click", () => {
            if (el.classList.contains("used")) return;
            st.used.add(Number(el.dataset.wi));
            const ans = document.getElementById(`eng-build-ans-${qi}`);
            const chip = document.createElement("span");
            chip.className = "eng-build-word";
            chip.textContent = el.textContent;
            chip.dataset.wi = el.dataset.wi;
            chip.addEventListener("click", () => {
              st.used.delete(Number(chip.dataset.wi));
              chip.remove();
              renderBuildPool(qi);
            });
            ans.appendChild(chip);
            renderBuildPool(qi);
          });
        });
      }

      buildBox.querySelectorAll("[data-reset]").forEach(btn => {
        btn.addEventListener("click", () => {
          const qi = btn.dataset.reset;
          buildState[qi].used = new Set();
          document.getElementById(`eng-build-ans-${qi}`).innerHTML = "";
          document.getElementById(`eng-build-result-${qi}`).textContent = "";
          renderBuildPool(qi);
        });
      });
    }

    // ---- Matching (ghép cặp) ----
    const matchBox = document.getElementById("eng-match");
    const matchState = [];
    if (matchBox) {
      ex.matching.forEach((blockData, bi) => {
        const wrap = document.createElement("div");
        wrap.className = "eng-quiz-q";
        wrap.innerHTML = `<p>Ghép từ tiếng Anh với nghĩa tiếng Việt:${diffBadge(blockData.difficulty)}</p>
          <div class="eng-match-cols">
            <div class="eng-match-col" id="eng-match-left-${bi}"></div>
            <div class="eng-match-col" id="eng-match-right-${bi}"></div>
          </div>
          <div class="eng-match-paired" id="eng-match-paired-${bi}"></div>
          <button class="eng-btn ghost" data-match-reset="${bi}" style="margin-top:6px;">Làm lại</button>`;
        matchBox.appendChild(wrap);
        matchState[bi] = {
          pairs: blockData.pairs,
          left: shuffle(blockData.pairs.map((p, i) => ({ text: p.en, idx: i }))),
          right: shuffle(blockData.pairs.map((p, i) => ({ text: p.vi, idx: i }))),
          matched: {}, locked: new Set(), selectedLeft: null
        };
        renderMatch(bi);
      });

      function renderMatch(bi) {
        const st = matchState[bi];
        const leftCol = document.getElementById(`eng-match-left-${bi}`);
        const rightCol = document.getElementById(`eng-match-right-${bi}`);
        const pairedBox = document.getElementById(`eng-match-paired-${bi}`);

        leftCol.innerHTML = st.left.map(item =>
          `<button class="eng-build-word${st.locked.has("L" + item.idx) ? " used" : ""}${st.selectedLeft === item.idx ? " selected" : ""}" data-side="L" data-idx="${item.idx}">${item.text}</button>`
        ).join("");
        rightCol.innerHTML = st.right.map(item =>
          `<button class="eng-build-word${st.locked.has("R" + item.idx) ? " used" : ""}" data-side="R" data-idx="${item.idx}">${item.text}</button>`
        ).join("");
        pairedBox.innerHTML = Object.entries(st.matched).map(([l, r]) =>
          `<div class="eng-match-paired-item"><span>${st.pairs[l].en} — ${st.pairs[r].vi}</span><button class="eng-match-unpair" data-unpair-l="${l}" data-block="${bi}">✕</button></div>`
        ).join("");

        leftCol.querySelectorAll("[data-side='L']").forEach(btn => {
          btn.addEventListener("click", () => {
            if (btn.classList.contains("used")) return;
            st.selectedLeft = Number(btn.dataset.idx);
            renderMatch(bi);
          });
        });
        rightCol.querySelectorAll("[data-side='R']").forEach(btn => {
          btn.addEventListener("click", () => {
            if (btn.classList.contains("used") || st.selectedLeft === null) return;
            const rIdx = Number(btn.dataset.idx);
            st.matched[st.selectedLeft] = rIdx;
            st.locked.add("L" + st.selectedLeft);
            st.locked.add("R" + rIdx);
            st.selectedLeft = null;
            renderMatch(bi);
          });
        });
        pairedBox.querySelectorAll("[data-unpair-l]").forEach(btn => {
          btn.addEventListener("click", () => {
            const l = btn.dataset.unpairL;
            const r = st.matched[l];
            st.locked.delete("L" + l);
            st.locked.delete("R" + r);
            delete st.matched[l];
            renderMatch(bi);
          });
        });
      }

      matchBox.querySelectorAll("[data-match-reset]").forEach(btn => {
        btn.addEventListener("click", () => {
          const bi = btn.dataset.matchReset;
          matchState[bi].matched = {};
          matchState[bi].locked = new Set();
          matchState[bi].selectedLeft = null;
          renderMatch(bi);
        });
      });
    }

    // ---- Submit / grade everything ----
    document.getElementById("eng-submit").addEventListener("click", async () => {
      let correct = 0, total = 0;

      if (mcBox) {
        ex.multipleChoice.forEach((q, qi) => {
          total++;
          mcBox.querySelectorAll(`.eng-opt[data-qi="${qi}"]`).forEach(b => {
            if (b.dataset.opt === q.answer) b.classList.add("correct");
            else if (b.dataset.opt === mcSelections[qi]) b.classList.add("wrong");
          });
          if (mcSelections[qi] === q.answer) correct++;
        });
      }
      if (tfBox) {
        ex.trueFalse.forEach((q, qi) => {
          total++;
          const want = String(q.isTrue);
          tfBox.querySelectorAll(`.eng-opt[data-tf="${qi}"]`).forEach(b => {
            if (b.dataset.val === want) b.classList.add("correct");
            else if (b.dataset.val === tfSelections[qi]) b.classList.add("wrong");
          });
          if (tfSelections[qi] === want) correct++;
        });
      }
      if (fillBox) {
        ex.fillBlank.forEach((q, qi) => {
          total++;
          const input = fillBox.querySelector(`.eng-fill-input[data-qi="${qi}"]`);
          const ok = normalize(input.value) === normalize(q.answer);
          input.classList.add(ok ? "correct" : "wrong");
          if (ok) correct++;
        });
      }
      if (buildBox) {
        ex.sentenceBuild.forEach((q, qi) => {
          total++;
          const ans = document.getElementById(`eng-build-ans-${qi}`);
          const text = Array.from(ans.children).map(c => c.textContent).join(" ");
          const ok = normalize(text) === normalize(q.answer);
          const result = document.getElementById(`eng-build-result-${qi}`);
          result.className = "eng-build-result " + (ok ? "correct" : "wrong");
          result.textContent = ok ? "Đúng rồi!" : `Chưa đúng. Đáp án: "${q.answer}"`;
          if (ok) correct++;
        });
      }
      if (matchBox) {
        ex.matching.forEach((blockData, bi) => {
          const st = matchState[bi];
          total += blockData.pairs.length;
          Object.entries(st.matched).forEach(([l, r]) => { if (Number(l) === Number(r)) correct++; });
        });
      }

      const resultBox = document.getElementById("eng-result");
      resultBox.style.display = "block";
      resultBox.textContent = `Bạn đúng ${correct}/${total} câu. ${correct === total ? "Xuất sắc!" : "Ôn lại phần sai rồi học tiếp nhé"}`;

      try {
        let days = JSON.parse(await Store.get(KEY_DAYS) || "[]");
        let scores = JSON.parse(await Store.get(KEY_SCORES) || "{}");
        scores[dayId] = `${correct}/${total}`;
        await Store.set(KEY_SCORES, JSON.stringify(scores));

        if (!days.includes(dayId)) {
          days.push(dayId);
          await Store.set(KEY_DAYS, JSON.stringify(days));
          let streak = parseInt(await Store.get(KEY_STREAK), 10) || 0;
          streak += 1;
          await Store.set(KEY_STREAK, String(streak));
          const streakNum = document.getElementById("eng-streak-num");
          const daysNum = document.getElementById("eng-days-num");
          if (streakNum) streakNum.textContent = streak;
          if (daysNum) daysNum.textContent = days.length;
        }
      } catch (e) { console.error("Storage error:", e); }
    });
  }

  (async function init() {
    const streak = parseInt(await Store.get(KEY_STREAK), 10) || 0;
    let days = [];
    try { days = JSON.parse(await Store.get(KEY_DAYS) || "[]"); } catch (e) { days = []; }
    render(streak, days.length);
  })();
})();
</script>
